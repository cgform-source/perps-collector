name: Collecte du dashboard
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main
concurrency:
  group: collecte
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Heure de départ
        run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comptes suivis par @analyserxxx (toutes les 6 h)
        continue-on-error: true
        run: |
          last=$(python3 -c "import json,datetime;d=json.load(open('data/following.json'));print(int(datetime.datetime.fromisoformat(d['at'].replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - last )) -gt 21600 ]; then
            npm install --no-save @the-convocation/twitter-scraper || true
            timeout 150 node following.mjs analyserxxx || echo "abonnements indisponibles"
          else echo "déjà fait il y a moins de 6 h"; fi
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
      - name: X sans compte (mode invité)
        run: |
          npm install --no-save @the-convocation/twitter-scraper || true
          node x_guest.mjs || echo "mode invité indisponible"
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          echo "outils Python X désactivés (lecture X par x_guest.mjs)"
      - run: timeout 600 python collect.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
      - name: Notifications (iPad)
        continue-on-error: true
        run: |
          pip install -q pywebpush || true
          timeout 120 python notify.py
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Enregistrer feed.json
        run: |
          git config user.name "collecteur"
          git config user.email "collecteur@users.noreply.github.com"
          for f in data/feed.json data/x_guest.json data/notify_state.json data/following.json data/first_calls.json data/tr_cache.json data/analyst.json config.json; do [ -f "$f" ] && git add "$f"; done
          [ -d data/perf ] && git add data/perf || true
          git commit -m "collecte $(date -u +%F_%H%M)" || echo "rien de nouveau"
          git pull --rebase -X theirs origin main || true
          git push
      # GitHub ne lance pas les tâches planifiées de ce dépôt : chaque collecte relance donc la suivante
      # environ 15 minutes après son propre départ (gratuit sur un dépôt public).
      - name: Programmer la collecte suivante
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 900 - ($(date +%s) - T0) ))
          if [ $left -gt 0 ]; then sleep $left; fi
          gh api -X POST repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches -f ref=main || true
