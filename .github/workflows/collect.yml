name: Collecte du dashboard
on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main
concurrency:
  group: collecte
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: X sans compte (mode invité)
        run: |
          npm install --no-save @the-convocation/twitter-scraper || true
          node x_guest.mjs || echo "mode invité indisponible"
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install Scweet || true
          pip install twscrape || true
          pip install twifork || pip install twikit || true
      - run: timeout 600 python collect.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
      - name: Enregistrer feed.json
        run: |
          git config user.name "collecteur"
          git config user.email "collecteur@users.noreply.github.com"
          git add data/feed.json data/x_guest.json || git add data/feed.json
          git commit -m "collecte $(date -u +%F_%H%M)" || echo "rien de nouveau"
          git pull --rebase -X theirs origin main || true
          git push
